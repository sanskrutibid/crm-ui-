<div class="email-page">

    <div class="email-card">

        <div class="email-header">

            <h2>
                Send Email to
                <span>{{ customerName }}</span>
            </h2>

            <p>Compose and schedule professional emails.</p>

        </div>

        <div class="email-body">

            <!-- Template -->

            <div class="form-group">

                <label>Email Template</label>

                <select [(ngModel)]="selectedTemplate" (change)="onTemplateChange()">

                    <option value="">Select Template</option>

                    <option *ngFor="let temp of templates" [value]="temp.name">{{ temp.name }}</option>

                </select>

            </div>

            <!-- To -->

            <div class="form-group">

                <label>To</label>

                <input
                    type="email"
                    [(ngModel)]="toEmail"
                    placeholder="Enter recipient email">

            </div>

            <!-- Subject -->

            <div class="form-group">

                <label>Subject</label>

                <input
                    type="text"
                    [(ngModel)]="subject"
                    placeholder="Enter subject">

            </div>

            <!-- Message -->

            <div class="form-group">

                <label>Message</label>

                <div class="email-editor-wrapper">

                    <quill-editor
                        [(ngModel)]="message"
                        name="message"
                        [style]="{height:'350px'}">

                    </quill-editor>

                </div>

            </div>

            <!-- Schedule -->

            <div class="schedule-row">

                <div class="form-group">

                    <label>Schedule Date</label>

                    <input
                        type="date"
                        [(ngModel)]="scheduleDate">

                </div>

                <div class="form-group">

                    <label>Schedule Time</label>

                    <input
                        type="time"
                        [(ngModel)]="scheduleTime">

                </div>

            </div>

            <div class="button-area">

                <button class="cancel-btn" (click)="cancel()">
                    Cancel
                </button>

                <button
                    class="send-btn"
                    (click)="sendEmail()">

                    <i class="fas fa-paper-plane"></i>

                    Send Email

                </button>

            </div>

        </div>

    </div>

</div>
