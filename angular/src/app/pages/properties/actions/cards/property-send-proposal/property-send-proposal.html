<div class="proposal-page">

    <div class="proposal-card">

        <div class="proposal-header">

            <h2>Send Proposal</h2>

            <p>Share property proposal with your client through email.</p>

        </div>

        <div class="proposal-body">

            <div class="form-group">

                <label>Template</label>

                <select class="form-control">
                    <option>Select Template</option>
                    <option>Residential Proposal</option>
                    <option>Commercial Proposal</option>
                    <option>Luxury Proposal</option>
                </select>

            </div>

            <div class="form-group">

                <label>To</label>

                <input
                    type="email"
                    class="form-control"
                    placeholder="Enter client email">

            </div>

            <div class="form-group">

                <label>Subject</label>

                <input
                    type="text"
                    class="form-control"
                    placeholder="Enter email subject">

            </div>

            <div class="form-group">

                <label>Proposal Message</label>

                <textarea
                    class="form-control message-box"
                    placeholder="Write your proposal here..."></textarea>

            </div>

            <div class="schedule-row">

                <div class="form-group">

                    <label>Schedule Date</label>

                    <input
                        type="date"
                        class="form-control">

                </div>

                <div class="form-group">

                    <label>Time</label>

                    <input
                        type="time"
                        class="form-control">

                </div>

            </div>

            <div class="action-row">

                <button class="discard-btn">
                    Cancel
                </button>

                <button class="send-btn">

                    <i class="fas fa-paper-plane"></i>

                    Send Proposal

                </button>

            </div>

        </div>

    </div>

</div>
