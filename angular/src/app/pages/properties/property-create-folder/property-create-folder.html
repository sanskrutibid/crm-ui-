<div class="create-folder-page">

    <div class="folder-card">

        <div class="page-header">

            <button class="back-btn" (click)="goBack()">
                <i class="fas fa-arrow-left"></i>
                Back
            </button>

            <h2>Create Folder</h2>

            <p>My Properties • Total Records <span>({{ totalPropertiesCount }})</span></p>

        </div>

        <form (ngSubmit)="submitFolder()">

            <div class="form-group">

                <label>
                    Folder Name <span>*</span>
                </label>

                <input
                    type="text"
                    name="folderName"
                    [(ngModel)]="folderName"
                    placeholder="Enter Folder Name">

            </div>

            <div class="form-group">

                <label>Order Number</label>

                <input
                    type="number"
                    name="orderNumber"
                    [(ngModel)]="orderNumber">

            </div>

            <div class="form-group">

                <label>Permission</label>

                <select [(ngModel)]="permission" name="permission">

                    <option value="">Select Permission</option>
                    <option value="private">Private</option>
                    <option value="public">Public</option>
                    <option value="team">Team</option>

                </select>

            </div>

            <div class="form-group">

                <label>Property Category</label>

                <select [(ngModel)]="categoryProperty" name="categoryProperty">

                    <option value="">Select Category</option>
                    <option value="Residential">Residential</option>
                    <option value="Commercial">Commercial</option>
                    <option value="Industrial">Industrial</option>
                    <option value="Agricultural">Agricultural</option>

                </select>

            </div>

            <div class="checkbox-group">

                <label>

                    <input type="checkbox" name="onlyAssigned" [(ngModel)]="onlyAssigned">

                    Only my assigned data

                </label>

            </div>

            <div class="checkbox-group">

                <label>

                    <input type="checkbox" name="smartFolder" [(ngModel)]="smartFolder">

                    Create Smart Folder

                </label>

            </div>

            <div class="btn-group">

                <button class="submit-btn" type="submit" [disabled]="isSubmitting">

                    <i class="fas fa-folder-plus"></i>

                    {{ isSubmitting ? 'Creating...' : 'Create Folder' }}

                </button>

                <button class="cancel-btn"
                        (click)="goBack()"
                        type="button">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>
