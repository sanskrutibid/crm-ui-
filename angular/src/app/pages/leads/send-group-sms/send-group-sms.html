<div class="sms-container">

  <div class="sms-card">

    <div class="sms-header">
      <h2>Group SMS for <span>My Leads</span></h2>
      <p>Total Records: {{ totalRecords }}</p>
    </div>

    <div class="sms-body">

      <div class="form-group">
        <label>Template <span>*</span></label>

        <select [(ngModel)]="selectedTemplate" (change)="onTemplateChange()">
          <option value="">Select Template</option>
          <option *ngFor="let t of templates" [value]="t.name">{{ t.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>DLT Template ID</label>

        <input
          type="text"
          [(ngModel)]="dltTemplateId"
          placeholder="Approved DLT Template ID">
      </div>

      <div class="form-group">
        <label>Message</label>

        <textarea
          [(ngModel)]="message"
          rows="6"
          maxlength="165"
          placeholder="Type SMS message here...">
        </textarea>

        <div class="char-count">
          {{ message.length || 0 }}/165 Characters
        </div>
      </div>

      <div class="schedule-row">

        <div class="schedule-field">
          <label>Schedule Date</label>
          <input
            type="date"
            [(ngModel)]="scheduleDate">
        </div>

        <div class="schedule-field">
          <label>Schedule Time</label>
          <input
            type="time"
            [(ngModel)]="scheduleTime">
        </div>

      </div>

      <div class="footer-actions">

        <button
          class="btn-cancel"
          type="button"
          (click)="close.emit()">
          Cancel
        </button>

        <button
          class="btn-submit"
          type="button"
          (click)="scheduleSms()">
          Schedule SMS
        </button>

      </div>

    </div>

  </div>

</div>
