<div class="export-widget-card">
  
  <div class="widget-header">
    <div class="title-area">
      <h2>Export Total Records</h2>
      <span class="record-badge">{{ totalRecords | number }} Projects</span>
    </div>
    <button class="close-widget-btn" (click)="closePanel()">✕</button>
  </div>

  <div class="widget-notice-bar">
    <span class="notice-indicator"></span>
    <p>High data volume. Recommended limit per export is 4,000 to prevent system timeout.</p>
  </div>

  <div class="widget-body">
    
    <div class="config-row">
      <label for="pageSizeSelect">Set Export Limit</label>
      <select id="pageSizeSelect" class="widget-select" [(ngModel)]="selectedLimit">
        <option [value]="1000">1,000 Projects</option>
        <option [value]="2000">2,000 Projects</option>
        <option [value]="4000">4,000 Projects (Safe)</option>
        <option [value]="totalRecords">All {{ totalRecords | number }} Projects</option>
      </select>
    </div>

    <div class="export-grid">
      
      <div class="grid-card excel-theme" (click)="startDownload('excel')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        </div>
        <div class="card-meta">
          <h4>Download Excel</h4>
          <p>Local backup (.csv)</p>
        </div>
      </div>

      <div class="grid-card drive-theme" (click)="startDownload('google-drive')">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="card-meta">
          <h4>Google Drive</h4>
          <p>Cloud export</p>
        </div>
      </div>

    </div>

    <div class="widget-footer">
      <p>Need custom full account backup assistance? <a href="mailto:support@example.com" class="footer-link">Contact Support</a></p>
    </div>

  </div>

</div>
