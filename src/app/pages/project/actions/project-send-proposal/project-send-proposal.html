<div class="proposal-page">

    <div class="proposal-card">

        <div class="proposal-header">

            <h2>Send Project Proposal</h2>

            <p>Share project proposal with your client through email.</p>

        </div>

        <div class="proposal-body">

            <div class="form-group">

                <label>Template</label>

                <select class="form-control" [(ngModel)]="selectedTemplate" (change)="onTemplateChange()">
                    <option value="">Select Template</option>
                    <option *ngFor="let temp of templates" [value]="temp.id || temp.name">
                        {{ temp.name }}
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label>To</label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="toEmail"
                    placeholder="Enter client email">

            </div>

            <div class="form-group">

                <label>Subject</label>

                <input
                    type="text"
                    class="form-control"
                    [(ngModel)]="subject"
                    placeholder="Enter email subject">

            </div>

            <div class="form-group">

                <label>Proposal Message</label>

                <textarea
                    class="form-control message-box"
                    [(ngModel)]="message"
                    placeholder="Write your proposal here..."></textarea>

            </div>

            <div class="schedule-row">

                <div class="form-group">

                    <label>Schedule Date</label>

                    <input
                        type="date"
                        class="form-control"
                        [(ngModel)]="scheduleDate">

                </div>

                <div class="form-group">

                    <label>Time</label>

                    <input
                        type="time"
                        class="form-control"
                        [(ngModel)]="scheduleTime">

                </div>

            </div>

            <div class="action-row">

                <button class="discard-btn" (click)="cancel()">
                    Cancel
                </button>

                <button class="send-btn" (click)="sendProposal()">

                    <i class="fas fa-paper-plane"></i>

                    Send Proposal

                </button>

            </div>

        </div>

    </div>

</div>
