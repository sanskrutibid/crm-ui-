<div class="deductions-page">

    <div class="page-header">

        <div>

            <h2>Deductions</h2>

            <p>Manage employee salary deductions</p>

        </div>

        <button class="btn btn-primary">

            <i class="fas fa-plus me-2"></i>

            Add Deduction

        </button>

    </div>

    <!-- Filters -->

    <div class="filter-card">

        <div class="row">

            <div class="col-lg-3 mb-3">

                <label>Department</label>

                <select class="form-select">

                    <option>All Departments</option>
                    <option>IT</option>
                    <option>HR</option>
                    <option>Sales</option>
                    <option>Accounts</option>

                </select>

            </div>

            <div class="col-lg-3 mb-3">

                <label>Deduction Type</label>

                <select class="form-select">

                    <option>All</option>
                    <option>Professional Tax</option>
                    <option>Loan</option>
                    <option>Advance Salary</option>
                    <option>Late Penalty</option>
                    <option>Other</option>

                </select>

            </div>

            <div class="col-lg-3 mb-3">

                <label>Month</label>

                <select class="form-select">

                    <option>January</option>
                    <option selected>July</option>

                </select>

            </div>

            <div class="col-lg-3 mb-3">

                <label>Employee</label>

                <input
                    class="form-control"
                    placeholder="Search Employee">

            </div>

        </div>

    </div>

    <!-- Table -->

    <div class="table-card">

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>Employee</th>

                    <th>Department</th>

                    <th>Deduction Type</th>

                    <th>Amount</th>

                    <th>Month</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let item of deductions">

                    <td>

                        <div class="employee-info">

                            <img [src]="item.image">

                            <div>

                                <h6>{{item.name}}</h6>

                                <span>{{item.id}}</span>

                            </div>

                        </div>

                    </td>

                    <td>{{item.department}}</td>

                    <td>{{item.type}}</td>

                    <td>₹ {{item.amount}}</td>

                    <td>{{item.month}}</td>

                    <td>

                        <span
                            class="badge bg-success">

                            {{item.status}}

                        </span>

                    </td>

                    <td>

                        <button class="btn btn-primary btn-sm me-2">

                            <i class="fas fa-edit"></i>

                        </button>

                        <button class="btn btn-danger btn-sm">

                            <i class="fas fa-trash"></i>

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
