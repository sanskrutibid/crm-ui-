<div class="mark-attendance-page">

    <div class="page-header">

        <div>

            <h2>Mark Attendance</h2>

            <p>Mark user attendance manually</p>

        </div>

    </div>

    <form [formGroup]="attendanceForm" (ngSubmit)="saveAttendance()">

        <div class="form-card">

            <div class="row">

                <div class="col-lg-4 mb-3">

                    <label>User <span>*</span></label>

                    <select
                        class="form-select"
                        formControlName="employee">

                        <option value="">Select User</option>

                        <option *ngFor="let usr of users"
                                [value]="usr.id">

                            {{usr.name}}

                        </option>

                    </select>

                </div>

                <div class="col-lg-4 mb-3">

                    <label>Date</label>

                    <input
                        type="date"
                        class="form-control"
                        formControlName="date">

                </div>

                <div class="col-lg-4 mb-3">

                    <label>Status</label>

                    <select
                        class="form-select"
                        formControlName="status">

                        <option>Present</option>
                        <option>Absent</option>
                        <option>Late</option>
                        <option>Leave</option>
                        <option>Half Day</option>

                    </select>

                </div>

                <div class="col-lg-3 mb-3">

                    <label>Check In</label>

                    <input
                        type="time"
                        class="form-control"
                        formControlName="checkIn">

                </div>

                <div class="col-lg-3 mb-3">

                    <label>Check Out</label>

                    <input
                        type="time"
                        class="form-control"
                        formControlName="checkOut">

                </div>

                <div class="col-lg-3 mb-3">

                    <label>Working Hours</label>

                    <input
                        class="form-control"
                        formControlName="workingHours"
                        readonly>

                </div>

                <div class="col-lg-3 mb-3">

                    <label>Late By</label>

                    <input
                        class="form-control"
                        formControlName="lateBy">

                </div>

                <div class="col-12 mb-3">

                    <label>Remarks</label>

                    <textarea
                        rows="4"
                        class="form-control"
                        formControlName="remarks">
                    </textarea>

                </div>

            </div>

        </div>

        <div class="text-end">

            <button
                type="reset"
                class="btn btn-light me-2">

                Reset

            </button>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fas fa-save me-2"></i>

                Save Attendance

            </button>

        </div>

    </form>

</div>
