<div class="timeline-page">

<div class="toolbar">
    
  <div class="toolbar-item">
    <select class="form-select" [(ngModel)]="selectedUserId">
      <option value="" disabled selected>Select Employee</option>
      <option *ngFor="let agent of agents" [value]="agent.id">
        {{ agent.firstName }} {{ agent.lastName || '' }}
      </option>
    </select>
  </div>

  <button class="search-btn" (click)="searchRoute()">
    <i class="fas fa-search"></i>
    Search
  </button>

  <div class="distance-card">
    <span>Total Distance</span>
    <h3>{{ totalDistance }} km</h3>
  </div>

</div>

  <div class="map-wrapper" style="position: relative; width: 100%; height: calc(100vh - 170px); min-height: 400px; border-radius: 8px; overflow: hidden;">
    <!-- Google Map Embed: 100% Free, Official Google Maps, works immediately without API key -->
    <iframe *ngIf="!hasSdkMap && mapSecureUrl"
      [src]="mapSecureUrl"
      width="100%"
      height="100%"
      style="border:0; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 8px;"
      loading="lazy"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <div id="map" [style.display]="hasSdkMap ? 'block' : 'none'" style="width: 100%; height: 100%;"></div>
  </div>

</div>
