<div class="group-transfer-card">

<div class="header">

  <div class="header-left">

  <button
  class="back-btn"
  (click)="goBackToMyLeads()">

  <i class="fas fa-arrow-left"></i>
  Back

</button>

    <h2>{{ title }}</h2>

  </div>

  <button class="close-btn" (click)="closeTransfer()">
    <i class="fas fa-times"></i>
  </button>

</div>
  <div class="record-box">
    Total record will transfer:
    <strong>{{ totalRecords }}</strong>
  </div>

  <div *ngIf="showTransferType">

    <label class="label">Transfer Type</label>

    <div class="radio-group">

      <label>
        <input
          type="radio"
          name="transferType"
          [value]="transferLabel"
          [(ngModel)]="transferType">
        {{ transferLabel }}
      </label>

      <label>
        <input
          type="radio"
          name="transferType"
          value="Cold Calling Transfer"
          [(ngModel)]="transferType">
        Cold Calling Transfer
      </label>

    </div>

  </div>

  <div class="form-group">
    <label>Folder</label>

  <select [(ngModel)]="folder">
  <option value="">Select</option>

  <option
    *ngFor="let item of folders"
    [value]="item.value">

    {{ item.label }}

  </option>
</select>
  </div>

  <div class="or-text">OR</div>

  <div class="form-group">
    <label>Branch</label>

   <select [(ngModel)]="branch">
  <option value="">Select</option>

  <option
    *ngFor="let item of branches"
    [value]="item.value">

    {{ item.label }}

  </option>
</select>
  </div>

  <div class="form-group">
    <label>Assign To</label>

   <select [(ngModel)]="assignTo">
  <option value="">Select</option>

  <option
    *ngFor="let item of assignUsers"
    [value]="item.value">

    {{ item.label }}

  </option>
</select>
  </div>

  <div *ngIf="showAssignMode">

    <div class="radio-group">

      <label>
        <input
          type="radio"
          name="assignMode"
          value="Regular"
          [(ngModel)]="assignMode">
        Regular
      </label>

      <label>
        <input
          type="radio"
          name="assignMode"
          value="Random"
          [(ngModel)]="assignMode">
        Random
      </label>

    </div>

  </div>

  <div class="or-text">OR</div>

  <div class="form-group">
    <label>Permission</label>

   <select [(ngModel)]="permission">
  <option value="">Select</option>

  <option
    *ngFor="let item of permissions"
    [value]="item.value">

    {{ item.label }}

  </option>
</select>
  </div>

  <div *ngIf="showComment" class="form-group">

    <label>Comment</label>

    <textarea
      rows="4"
      [(ngModel)]="comment">
    </textarea>

  </div>

  <div class="footer-buttons">

    <button
      class="cancel-btn"
      (click)="closeTransfer()">

      Cancel

    </button>

    <button
      class="transfer-btn"
      (click)="transferRecords()">

      Transfer

    </button>

  </div>

</div>
