<div class="create-audience-container">
  <div class="page-header">
    <h2>Create Audience for All Contacts</h2>
    <span class="badge-records">Total Records: {{ totalRecords | number }}</span>
  </div>

  <div *ngIf="statusMessage" class="status-message" [ngClass]="statusType">
    {{ statusMessage }}
  </div>

  <form class="audience-form" (submit)="onSubmit($event)">
    <div class="form-group">
      <label for="audienceName">Name<span class="required">*</span></label>
      <input 
        type="text" 
        id="audienceName" 
        class="form-control" 
        [(ngModel)]="audienceName"
        name="audienceName"
        placeholder="Enter audience name" 
        required>
    </div>

    <div class="form-group">
      <label for="audienceType">Type<span class="required">*</span></label>
      <select 
        id="audienceType" 
        class="form-control" 
        [(ngModel)]="audienceType"
        (change)="onTypeChange()"
        name="audienceType"
        required>
        <option value="" disabled selected>Select Type</option>
        <option value="Email">Email</option>
        <option value="SMS">SMS</option>
        <option value="IVR">IVR</option>
        <option value="WhatsApp">WhatsApp</option>
      </select>
    </div>

    <div class="form-group">
      <label for="audienceTemplate">Template<span class="required">*</span></label>
      <select 
        id="audienceTemplate" 
        class="form-control" 
        [(ngModel)]="selectedTemplateId"
        name="selectedTemplateId"
        required>
        <option value="" disabled selected>
          {{ audienceType ? 'Select Template' : 'Please select Type first' }}
        </option>
        <option *ngFor="let temp of templates" [value]="temp.id">{{ temp.name }}</option>
        <option *ngIf="audienceType && templates.length === 0" value="" disabled>
          (No templates found for {{ audienceType }})
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="audienceSchedule">Schedule<span class="required">*</span></label>
      <select 
        id="audienceSchedule" 
        class="form-control" 
        [(ngModel)]="schedule"
        name="schedule"
        required>
        <option value="On Demand">On Demand</option>
        <option value="Daily">Daily</option>
        <option value="Weekly">Weekly</option>
        <option value="Monthly">Monthly</option>
      </select>
    </div>

    <!-- On Demand scheduling options -->
    <div *ngIf="schedule === 'On Demand'" class="form-group">
      <label>Date and Time<span class="required">*</span></label>
      <div class="schedule-grid">
        <input type="date" class="form-control" [(ngModel)]="scheduleDate" name="scheduleDate" required>
        <input type="time" class="form-control" [(ngModel)]="scheduleTime" name="scheduleTime" required>
      </div>
    </div>

    <!-- Daily scheduling options -->
    <div *ngIf="schedule === 'Daily'" class="form-group">
      <label>Preferred Time<span class="required">*</span></label>
      <input type="time" class="form-control" [(ngModel)]="scheduleTime" name="scheduleTime" required>
    </div>

    <!-- Weekly scheduling options -->
    <div *ngIf="schedule === 'Weekly'" class="form-group">
      <label>Select Days of the Week<span class="required">*</span></label>
      <div class="weekday-container">
        <button type="button" 
                *ngFor="let day of weekdays" 
                class="weekday-pill" 
                [class.selected]="selectedWeeks.includes(day)"
                (click)="toggleWeekday(day)">
          {{ day }}
        </button>
      </div>
      <div class="form-group mt-2">
        <label>Preferred Time<span class="required">*</span></label>
        <input type="time" class="form-control" [(ngModel)]="scheduleTime" name="scheduleTime" required>
      </div>
    </div>

    <!-- Monthly scheduling options -->
    <div *ngIf="schedule === 'Monthly'" class="form-group">
      <label>Select Dates of the Month<span class="required">*</span></label>
      <div class="days-grid">
        <button type="button" 
                *ngFor="let dayNum of monthDays" 
                class="day-pill" 
                [class.selected]="selectedDays.includes(dayNum)"
                (click)="toggleMonthDay(dayNum)">
          {{ dayNum }}
        </button>
      </div>
      <div class="form-group mt-2">
        <label>Preferred Time<span class="required">*</span></label>
        <input type="time" class="form-control" [(ngModel)]="scheduleTime" name="scheduleTime" required>
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="button" 
        class="btn btn-cancel" 
        [disabled]="isSubmitting" 
        (click)="closeAudienceForm()">
        Cancel
      </button>
      <button 
        type="submit" 
        class="btn btn-submit" 
        [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Create Audience' }}
      </button>
    </div>
  </form>
</div>
