<div class="audience-page">

  <div class="audience-card">

    <div class="page-header">

      <button class="back-btn" (click)="back()">
        <i class="fas fa-arrow-left"></i>
        Back
      </button>
    
      <h2>Create Audience</h2>

      <p>
        My Properties
        <span>Total Records : {{ totalRecords }}</span>
      </p>

    </div>

    <form #audienceForm="ngForm">

      <div class="form-group">
        <label>Name <span>*</span></label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="audienceName"
          name="audienceName"
          placeholder="Enter Audience Name"
          required>
      </div>

      <div class="form-group">
        <label>Type <span>*</span></label>
        <select
          class="form-control"
          [(ngModel)]="audienceType"
          name="audienceType"
          (change)="onTypeChange()"
          required>
          <option value="" disabled selected>Select Type</option>
          <option value="Email">Email</option>
          <option value="SMS">SMS</option>
          <option value="IVR">IVR</option>
          <option value="WhatsApp">WhatsApp</option>
        </select>
      </div>

      <div class="form-group">
        <label>Template <span>*</span></label>
        <select
          class="form-control"
          [(ngModel)]="selectedTemplateId"
          name="selectedTemplateId"
          required>
          <option value="" disabled selected>
            {{ audienceType ? 'Select Template' : 'Please select Type first' }}
          </option>
          <option *ngFor="let temp of templates" [value]="temp.id || temp._id">{{ temp.name }}</option>
          <option *ngIf="audienceType && templates.length === 0" value="" disabled>
            (No templates found for {{ audienceType }})
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Schedule <span>*</span></label>
        <select
          class="form-control"
          [(ngModel)]="scheduleType"
          name="scheduleType"
          required>
          <option value="" disabled selected>Select Schedule</option>
          <option value="now">Send Now</option>
          <option value="later">Schedule Later</option>
        </select>
      </div>

      <div class="schedule-box" *ngIf="scheduleType === 'later'" style="margin-bottom: 22px;">
        <div style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <label>Date <span>*</span></label>
            <input
              type="date"
              class="form-control"
              [(ngModel)]="scheduleDate"
              name="scheduleDate">
          </div>

          <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <label>Time <span>*</span></label>
            <input
              type="time"
              class="form-control"
              [(ngModel)]="scheduleTime"
              name="scheduleTime">
          </div>
        </div>
      </div>

      <div class="button-group">
        <button
          type="button"
          class="submit-btn"
          [disabled]="isSubmitting || !audienceName.trim() || !audienceType || !selectedTemplateId || !scheduleType"
          (click)="submitAudience()">
          <i class="fas fa-bullhorn"></i>
          {{ isSubmitting ? 'Creating...' : 'Create Audience' }}
        </button>

        <button
          type="button"
          (click)="back()"
          class="cancel-btn">
          Cancel
        </button>
      </div>

    </form>

  </div>

</div>
