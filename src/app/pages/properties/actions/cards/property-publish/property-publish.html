<div class="publish-page">

  <div class="page-header">
    <div>
      <h2>Publish Property</h2>
      <p>Publish or unpublish this property on your portals.</p>
    </div>
  </div>

  <div class="publish-card">

    <div class="section-title">
      <i class="fas fa-upload"></i>
      Publishing Settings
    </div>

    <!-- Publish Status -->
    <div class="form-group">

      <label>Status</label>

      <div class="radio-group">

        <label class="radio-item">
          <input type="radio" name="status" checked>
          <span>Publish</span>
        </label>

        <label class="radio-item">
          <input type="radio" name="status">
          <span>Unpublish</span>
        </label>

      </div>

    </div>

    <!-- Portal -->

    <div class="form-group">

      <label>Publish To</label>

      <select>

        <option>Select Portal</option>
        <option>99 Acres</option>
        <option>MagicBricks</option>
        <option>Housing</option>
        <option>CommonFloor</option>

      </select>

    </div>

    <!-- Checkbox -->

    <div class="checkbox-group">

      <label>
        <input type="checkbox">
        Hide Price Information
      </label>

      <label>
        <input type="checkbox">
        Stay on this page after submission
      </label>

    </div>

    <!-- Buttons -->

    <div class="action-row">

      <button class="publish-btn">
        <i class="fas fa-upload"></i>
        Publish
      </button>

      <button class="cancel-btn">
        Cancel
      </button>

    </div>

  </div>

</div>
